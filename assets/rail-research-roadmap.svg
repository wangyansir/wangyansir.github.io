<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Motion-aware rail-surface inspection: causal three-frame research method</title>
<desc id="desc">Original method illustration, not photographs or measured segmentation output. Stylized rail crops at t minus two, t minus one and t feed motion alignment, warped historical defect evidence and current-frame segmentation. An experimental temporal-fusion path combines only past evidence with the current prediction to form a candidate mask. Missed detections and false-positive propagation require evaluation against a current-only baseline.</desc>
