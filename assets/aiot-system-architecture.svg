<text x="989" y="332" font-size="24" font-weight="700">Dual-output SVR</text><path d="M990 350H1252" stroke="#d6e2e7"/>
<g><rect x="987" y="366" width="120" height="80" rx="9" fill="#e1f1ec"/><rect x="1124" y="366" width="133" height="80" rx="9" fill="#e7edf8"/><text x="1047" y="397" font-size="18" text-anchor="middle">Watering</text><text x="1047" y="425" font-size="21" font-weight="700" text-anchor="middle">duration</text><text x="1190" y="397" font-size="18" text-anchor="middle">Next-event</text><text x="1190" y="425" font-size="21" font-weight="700" text-anchor="middle">interval</text></g>
