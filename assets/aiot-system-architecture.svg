<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="#173747" role="img" aria-labelledby="title desc">
<title id="title">AIoT irrigation and fertigation architecture</title><desc id="desc">Original architecture redrawn from Project Outline 3.0: soil, environment and tank sensors use a CC2530 star ZigBee network connected to STM32. UART or RS485 connects STM32 to a 4G DTU and a host with a dual-output SVR decision workflow. Threshold updates return to STM32, with ZigBee commands to a TB6612 driver and water and nutrient pumps. Automatic and manual operation share the control path.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5faf9"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#173e4c"/><stop offset="1" stop-color="#102a3b"/></linearGradient>
 <marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#4389b2"/></marker>
 <marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#238d78"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173e4c" flood-opacity=".08"/></filter>
 <style>text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:20px;letter-spacing:3px;font-weight:700;fill:#438475}.title{font-size:44px;font-weight:700;letter-spacing:-1px}.subtitle{font-size:22px;fill:#58717d}.zone{font-size:22px;letter-spacing:2px;font-weight:700;fill:#4e6b79}.label{font-size:25px;font-weight:700}.small{font-size:19px;fill:#5c7480}.white{fill:#fff}.wire{fill:none;stroke:#94b7c4;stroke-width:3}.icon{fill:none;stroke:#296d74;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style>
</defs>
<rect width="1400" height="900" rx="28" fill="url(#bg)"/>
