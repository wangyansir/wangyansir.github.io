<path d="M322 410Q341 391 360 410M312 396Q341 366 370 396M334 422Q341 415 348 422" fill="none" stroke="#c8f0e4" stroke-width="5" stroke-linecap="round"/>
<text x="341" y="489" class="label" text-anchor="middle">CC2530</text><text x="341" y="519" class="small" text-anchor="middle">Star ZigBee</text>
