<circle cx="137" cy="419" r="36" fill="#eaf2f9"/><path d="M127 432V401A10 10 0 0 1 147 401V432A17 17 0 1 1 127 432M137 409V441" class="icon"/><text x="77" y="491" class="small">Air · light</text>
<circle cx="137" cy="536" r="36" fill="#e7f4ef"/><path d="M117 520H157V551H117ZM119 536Q128 528 137 536T155 536" class="icon"/><text x="76" y="592" class="small">Tank · nutrients</text>
