<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">AIoT water and fertilizer system concept diagram</title>
  <desc id="desc">Proposed architecture only. Sensors connect through ZigBee nodes to an STM32 controller, with a 4G-DTU link to a host-side SVR model. The design maps the model policy to local execution levels. No completed hardware-chain validation is represented.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e2ded1" stroke-width=".65"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m0 0 7 3.5L0 7" fill="none" stroke="#6a7150" stroke-width="1.2"/></marker>
  </defs>
  <rect width="600" height="360" fill="#f4f0e5"/>
  <rect width="600" height="360" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif" fill="#424732">
    <text x="32" y="44" font-size="12" letter-spacing="2.5">AIoT AGRICULTURE</text>
    <text x="32" y="78" font-size="28" font-weight="600" letter-spacing="-.6">From sensing to decisions.</text>
    <text x="568" y="44" text-anchor="end" font-size="12" fill="#89846b">03 / IRRIGATION</text>
  </g>
  <g fill="none" stroke="#6a7150" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="38" y="141" width="92" height="70" rx="6" fill="#faf8ef"/>
    <path d="M57 157h54M57 165h54M57 173h54" opacity=".45"/>
    <path d="M130 176h40" marker-end="url(#arrow)"/>
    <rect x="170" y="141" width="92" height="70" rx="6" fill="#faf8ef"/>
    <path d="M190 158c14-14 38-14 52 0M198 166c10-10 26-10 36 0M207 174c5-5 13-5 18 0" opacity=".6"/>
    <path d="M262 176h40" marker-end="url(#arrow)"/>
    <rect x="302" y="141" width="92" height="70" rx="6" fill="#e1e4cd"/>
    <path d="M317 141v-10M333 141v-10M349 141v-10M365 141v-10M381 141v-10"/>
    <path d="M394 176h56" marker-end="url(#arrow)"/>
    <rect x="450" y="141" width="112" height="70" rx="6" fill="#faf8ef"/>
    <path d="M466 154h80M466 163h80" opacity=".35"/>
    <path d="M506 211v25h-88v-39h-24" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
    <path d="M348 211v47" marker-end="url(#arrow)"/>
    <rect x="270" y="258" width="156" height="34" rx="6" fill="#e1e4cd"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#424732">
    <text x="84" y="197" font-size="13" font-weight="600">SENSORS</text>
    <text x="216" y="197" font-size="14" font-weight="600">ZigBee</text>
    <text x="348" y="183" font-size="18" font-weight="600">STM32</text>
    <text x="506" y="191" font-size="14" font-weight="600">HOST / SVR</text>
    <text x="348" y="279" font-size="11" font-weight="600">EXECUTION LEVELS 0–3</text>
    <text x="84" y="123" font-size="10" letter-spacing="1">ACQUISITION</text>
    <text x="216" y="123" font-size="10" letter-spacing="1">NODES</text>
    <text x="506" y="123" font-size="10" letter-spacing="1">4G-DTU LINK</text>
    <text x="488" y="254" font-size="9" letter-spacing=".7">POLICY UPDATE</text>
  </g>
  <path d="M32 312H568" stroke="#d2c7b3"/>
  <text x="32" y="334" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.2" fill="#89846b">PROPOSED SYSTEM ARCHITECTURE</text>
  <text x="568" y="334" text-anchor="end" font-family="Arial, sans-serif" font-size="9" letter-spacing="1" fill="#89846b">CONCEPT DIAGRAM</text>
</svg>
